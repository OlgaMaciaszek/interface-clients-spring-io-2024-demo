server:
  port: 8080
spring:
  interface-clients:
    http:
      client-groups:
        verificationClient:
          read-timeout: 555s
      connect-timeout: 999s
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      client:
        simple:
          instances:
            http-verification:
              - uri: http://localhost:8081
  application:
    name: http-verification-client
